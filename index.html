<!doctype html>
<html lang="en" data-font="fraunces">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kimberly Chen — UX Designer & Researcher</title>
<meta name="description" content="Kimberly Chen is a UX designer and researcher specializing in interface design, user research, and usability testing. Based in Tempe, AZ." />
<link rel="stylesheet" href="https://use.typekit.net/wrn6ozu.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" />
<link rel="stylesheet" href="styles.css?v=13" />
<link rel="stylesheet" href="case-study.css?v=2" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="core.jsx"></script>
<script type="text/babel" src="pages.jsx"></script>
<script type="text/babel" src="case-study.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;
const { Nav, ToTop, Footer, TweaksUI, Cursor } = window.PortfolioCore;
const { HomePage, ProjectsPage, AboutPage, ResumePage } = window.Pages;

function getHash() {
  const h = window.location.hash.replace("#", "");
  return ["home","projects","about","resume","case"].includes(h) ? h : "home";
}

function App() {
  const [route, setRoute] = useState(getHash);
  const [project, setProject] = useState(null);
  const [tweaks, setTweaks] = useState({ showTicker: false, heroVariant: "split", projectsVariant: "alt", collage: true, cursor: true });

  const navigate = (r) => {
    setRoute(r);
    window.location.hash = r;
  };

  useEffect(() => {
    const onHash = () => setRoute(getHash());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  useEffect(() => {
    const onTweak = (e) => setTweaks((prev) => ({ ...prev, ...e.detail }));
    window.addEventListener("__tweaks", onTweak);
    return () => window.removeEventListener("__tweaks", onTweak);
  }, []);

  useEffect(() => { window.scrollTo({ top: 0, behavior: "smooth" }); }, [route]);

  useEffect(() => { window.__setCase = (id) => { setProject(id); navigate("case"); }; }, []);

  let body;
  if (route === "home") body = <HomePage setRoute={navigate} setProject={setProject} tweaks={tweaks} />;
  else if (route === "projects") body = <ProjectsPage setRoute={navigate} />;
  else if (route === "about") body = <AboutPage />;
  else if (route === "resume") body = <ResumePage />;
  else if (route === "case") body = <window.ShuttleCaseStudy setRoute={navigate} />;

  return (
    <div className="app-shell">
      <Nav route={route} setRoute={navigate} />
      {body}
      <Footer setRoute={navigate} />
      <ToTop />
      <TweaksUI />
      {tweaks.cursor && <Cursor />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
